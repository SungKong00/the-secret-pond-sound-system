<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="618" viewBox="0 0 1280 618" role="img" aria-labelledby="title desc">
<title id="title">The Secret Pond sound system architecture</title>
<desc id="desc">An operator browser controls a local FastAPI process via HTTP and receives state over WebSocket. Microphone input passes through voice capture, local WAV sources, layer rendering, and the three-layer loop mixer to audio output.</desc>
<defs>
