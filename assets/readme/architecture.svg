  <symbol id="eq" viewBox="0 0 24 24"><g class="ico"><path d="M6 3v7m0 4v7M12 3v3m0 4v11M18 3v12m0 4v2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="17" r="2"/></g></symbol>
  <symbol id="mix" viewBox="0 0 24 24"><path class="ico" d="M3 5h4l10 14h4M3 12h18M3 19h4L17 5h4"/></symbol>
  <symbol id="speaker" viewBox="0 0 24 24"><path class="ico" d="M3 9h4l5-4v14l-5-4H3zm12 0a4 4 0 010 6m2-9a8 8 0 010 12"/></symbol>
