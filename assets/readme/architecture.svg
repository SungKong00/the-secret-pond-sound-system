  <linearGradient id="inner" x2="0" y2="1"><stop stop-color="#173638"/><stop offset="1" stop-color="#102929"/></linearGradient>
  <marker id="teal" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L6 3.5L0 7Z" fill="#78d4b9"/></marker>
  <marker id="violet" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L6 3.5L0 7Z" fill="#b8a9f5"/></marker>
  <style>
  text {font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  .title {font-size:40px;font-weight:680;fill:#f1faf7;}
  .eyebrow {font-size:15px;font-weight:650;letter-spacing:2.3px;fill:#92e0c8;}
  .subtitle {font-size:17px;fill:#b9d1cb;}
  .label {font-size:16px;font-weight:650;fill:#eaf6f2;}
  .detail {font-size:13.5px;fill:#b8d6ce;}
  .lane {font-size:12px;letter-spacing:1.35px;font-weight:650;fill:#a0d3c2;}
  .tag {font-size:12px;fill:#d7cbfa;font-weight:600}
  .action {stroke:#b8a9f5;stroke-width:2.0;fill:none;stroke-dasharray:5 5;marker-end:url(#violet);}
  .wire {stroke:#78d4b9;stroke-width:2.1;fill:none;marker-end:url(#teal);}
  .card {fill:#1b3c39;stroke:#3d685e;}
  .io {fill:#3b332d;stroke:#806046;}
  .cmd {fill:#2d2e47;stroke:#635b89;}
  .ico {fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <symbol id="screen" viewBox="0 0 24 24"><g class="ico"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v4m-4 0h8M3 7h18"/></g></symbol>
  <symbol id="server" viewBox="0 0 24 24"><g class="ico"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M12 7.5h5m-5 9h5"/></g></symbol>
  <symbol id="mic" viewBox="0 0 24 24"><g class="ico"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M6 10v2a6 6 0 0012 0v-2m-6 8v4m-3 0h6"/></g></symbol>
  <symbol id="wave" viewBox="0 0 24 24"><path class="ico" d="M2 12h3l2-5 4 11 4-13 3 7h4"/></symbol>
